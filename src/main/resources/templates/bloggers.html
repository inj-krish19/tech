<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" style="background: #343a40;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloggers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>
<style>
    .bloggers-list {
        padding: 20px;
        text-align: center;
    }

    .blogger-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
    }

    .blogger {
        background: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        width: 200px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s;
    }

    .blogger:hover {
        transform: scale(1.05);
    }

    .blogger-image {
        width: 100%;
        border-radius: 50%;
        height: auto;
        margin-bottom: 10px;
    }

    .blogger-name {
        font-size: 1.2em;
        color: #333;
    }

    .blogger-bio {
        font-size: 0.9em;
        color: #777;
        margin-bottom: 10px;
    }

    .view-profile {
        display: inline-block;
        padding: 8px 12px;
        background: #007bff;
        color: white;
        border-radius: 5px;
        text-decoration: none;
    }

    .view-profile:hover {
        background: #0056b3;
    }
</style>

<body style="background:#343a40">
    <div th:replace="~{header :: nav}"></div>

    <div class="bloggers-list" style="margin-bottom: 300px;">
        <h1>Our Bloggers</h1>
        <div class="blogger-container">
            <div th:each="blogger : ${bloggers}" class="post mb-4" style="max-width:800px;">
                <div class="post-card p-4">
                    <div class="post-content">
                        <div class="container">

                            <div class="author-box">
                                <div class="author-profile">
                                    <img th:src="@{images/logo.jpg}" alt="Author Profile Picture" class="author-image">
                                </div>
                                <div class="author-details">
                                    <h3 class="author-name" th:text="${blogger.name}"></h3><span
                                        th:text="'@'+${blogger.username}"> </span>
                                    <p class="author-bio" th:text="${blogger.bio}"></p>
                                </div>
                            </div>

                            <div class="post-metadata">
                                <div class="author-info">
                                    <i class="icon-user"></i>
                                    <span class="author-bio" th:text="'@' + ${blogger.username}"></span>
                                </div>
                                <div class="post-date">
                                    <i class="icon-calendar"></i>
                                    <span class="date-text" th:text="${blogger.updatedat}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{footer :: div}"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/scripts.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
