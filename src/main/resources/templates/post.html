<div class="posts-list" id="post-container">
	<div th:if="${#lists.isEmpty(posts)}" class="alert alert-dark text-center">
    	<h2 th:text="${news != null ? news : 'Posts Are Currently Not Available'}"></h2>
	</div>

	<div th:each="post : ${posts}" class="post mb-4" style="max-width:800px;">
		<div class="post-card p-4">
			<div class="post-content">
				<div class="container">

					<div class="author-box">
						<div class="author-profile">
							<img th:src="${post.image != null && post.image != '' ? post.image : '/images/logo.jpg'}"
							 alt="Author Profile Picture" class="author-image">
						</div>
						<div class="author-details">
							<h3 class="author-name" th:text="${post.name}"></h3>
							<span th:text="'@'+${post.username}"></span>
							<p class="author-bio" th:text="${post.bio}"></p>
						</div>
					</div>
					<div class="post-header d-flex align-items-center">
						<h2 class="post-title mb-0" th:text="${post.title}"></h2>
						<div class="post-category">
							<span class="badge bg-secondary" th:text="${post.category}"></span>
						</div>
					</div>


					<div th:classappend="${#strings.length(post.description) > 1000} ? 'post-image-large' : 'post-image-flex'"
					class="post-image">
						<img
							th:if="${post.media != null && post.media != ''}"
							th:src="${post.media != null && post.media != '' ? post.media : ''}" alt="Post Image"
							th:style="${#strings.length(post.description) > 1000} ? 'width: inherit; height: inherit;' : 'width: 300px; height: 300px;'" />
	
						<div class="post-content" style="overflow-wrap:anywhere;">
						    <!-- Show full description if less than or equal to 1000 characters -->
						    <p class="post-description" th:if="${post.description.length() <= 1000}" 
						       th:text="${post.description}" style="text-align: left;"></p>
						
						    <!-- Show truncated description if more than 1000 characters -->
						    <p class="post-description" th:if="${post.description.length() > 1000}" style="text-align: left;">
						        <span th:text="${post.description.substring(0, 1000)}"></span>
						        <span class="more-text" style="display: none;" 
						              th:text="${post.description.length() > 2500 ? post.description.substring(1000, 2500) : post.description.substring(1000)}"></span>
						        <button class="toggle-button" style="width:auto;"  onclick="toggleReadMore(this)">Read more...</button>
						    </p>
						</div>
					</div>
					<div class="post-actions d-flex border-top pt-3"
						style="margin-top :0; gap: 5px; justify-content: center;">
						<button class="articleid" th:text="${post.articleid}" style="display : none; "></button>
						<button class="like oper btn btn-dark d-flex align-items-center justify-content-center" style="gap: 5px;">
							<i class="bi bi-hand-thumbs-up"></i> <span class="likeCount" th:text="${post.likes}"></span>
						</button>
						<button class="dislike oper btn btn-dark d-flex align-items-center justify-content-center" style="gap: 5px;">
							<i class="bi bi-hand-thumbs-down"></i> <span class="dislikeCount" 
								th:text="${post.dislikes}"></span>
						</button>
						<button class="btn btn-dark d-flex align-items-center justify-content-center" data-bs-toggle="modal"
							data-bs-target="#commentModal" style="gap: 5px; position:static; ">
							<i class="bi bi-chat"></i><span
								th:text="${post.comments}"></span>
						</button>
						<button class="btn btn-dark d-flex align-items-center justify-content-center" style="gap: 5px;">
							<i class="bi bi-reply"></i>
						</button>
						<button class="btn btn-dark d-flex align-items-center justify-content-center" style="gap: 5px; " 
							th:attr="onclick=${post.articleid != null} ? 'watchPost(' + ${post.articleid} + ')' : null">							
							<i class="bi bi-share"></i>
						</button>
					</div>
					<div class="mycard d-flex" id="remaining" style="flex-direction: row; flex-wrap: wrap; min-height: 50px;">
				    <div th:if="${#lists.isEmpty(post.keywords)}">
					    <h2 style="display: inline; color: #5c5b5b;" >Keywords Not Selected</h2>
					</div>
					<div th:if="${!#lists.isEmpty(post.keywords)}">
					    <h2 style="display: inline; color: #5c5b5b;">Keywords: </h2>
					</div>
				    <th:block th:each="keyword, iterStat : ${post.keywords}">
				        <button th:class="'tag color-' + ${iterStat.index} + '-clicked'" 
				                th:attr="data-keyword=${keyword}" 
						        th:attrappend="data-url='/mass-filter/keyword/' + ${keyword}" 
						        class="tag" 
				                th:text="${keyword}">
				        </button>
				    </th:block>
				</div>
				</div>
				
				<div class="post-metadata">
					<div class="author-info">
						<span class="author-bio" th:text="'@' + ${post.username}"></span>
					</div>
					<div class="post-date">
						<i class="bi bi-calendar-fill" style=" margin-right : 5px; "></i>
						<span class="date-text" th:text=" ${post.status == 'draft' ? 'Drafted on ' : ''} + ${post.status == 'published' ? 'Published on ' : ''} + ${post.updatedat}"></span>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
