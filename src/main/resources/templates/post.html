<div class="posts-list mx-auto" id="post-container">
	<div th:if="${#lists.isEmpty(posts)}" class="post-content text-center">
		<h2 th:text="${news != null ? news : 'Posts Are Currently Not Available'}"></h2>
	</div>

	<div th:each="post : ${posts}" class="post mb-1	"
		style=" max-width:800px; min-width: 300px; background-color: var(--border-color);">
		<!--	Iliked : style=" min-width: 300px; background-color: var(--border-color);" -->
		<div class="post-card p-2"
			style="background-color: var(--bg-card); border: 1px solid var(--border-color); padding: 15px; border-radius: 10px;">
			<div class="post-content"
				style="background-color: var(--bg-container); border-radius: 10px; padding: 10px;">
				<div class="container ">

					<div class="author-box"
						style="background-color: var(--bg-container); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px;"
						th:attr="onclick=${post.author != null} ? 'redirectToBlogger(' + ${post.author} + ')' : null">
						<div class="author-profile">
							<img th:src="${post.image != null && post.image != '' ? post.image : '/images/logo.jpg'}"
								alt="Author Profile Picture" class="author-image">
						</div>
						<div class="author-details">
							<h3 class="author-name" th:text="${post.name}"></h3>
							<span class="author-username" th:text="'@'+${post.username}"></span>
							<p class="author-bio" th:text="${post.bio}"></p>
						</div>
					</div>
					<!--div class="post-header d-flex align-items-center">
						<h2 class="post-title mb-0" th:text="${post.title}"></h2>
						<div class="post-category">
							<span class="badge bg-secondary" th:text="${post.category}"></span>
						</div>
					</div -->
					<div class="post-header d-flex align-items-center"
						style="justify-content: space-between; margin-bottom: 10px;">
						<h2 class="post-title mb-0" th:text="${post.title}"
							style="font-size: 1.8rem; font-weight: 700; color: var(--text-color);">
						</h2>
						<div class="post-category">
							<span class="badge bg-secondary" th:text="${post.category}" style="font-size: 0.9rem;">
							</span>
						</div>
					</div>

					<!-- Old I liked Lyaout : Small x Large 
						
					<div class="row flex-col d-flex my-1">
						<img th:if="${post.media != null and post.media != ''}" 
						     th:src="${post.media}" 
						     alt="Post Image"
						     th:class="${post.description.length() < 1000 ? 'col-6' : (post.description.length() <= 2500 ? 'col-12' : 'col-12')}" />


						<div th:class="${(post.media == null or post.media == '') ? 'post-content col-12 text-center' : (post.description.length() < 1000 ? 'post-content col-6 text-center' : 'post-content col-12 text-center')}" 
						       style="overflow-wrap:anywhere; color: var(--text-color);">
						       
						    <p class="post-description" th:if="${post.description.length() <= 1000}"
						       th:utext="${post.description}" 
						       style="text-align: left; overflow: hidden; font-size: 1rem;">
						    </p>

						    <p class="post-description" th:if="${post.description.length() > 1000}"
						       style="text-align: left; overflow: hidden; font-size: 1rem;">
						      <span th:utext="${post.description.substring(0, 1000)}"></span>
						      <span class="more-text" style="display: none;"
						            th:utext="${post.description.length() > 2500 ? post.description.substring(1000, 2500) : post.description.substring(1000)}"></span>
						      <button class="toggle-button" 
						              style="width:auto; background: var(--accent-color); color: var(--button-text); border: none; padding: 5px 10px; border-radius: 5px;" 
						              onclick="toggleReadMore(this)">
						        Read more...
						      </button>
						    </p>

						</div>
					</div>
					
					-->

					<div class="row flex-col d-flex my-1">

						<div class="post-content col-12 text-center"
							style="overflow-wrap:anywhere; color: var(--text-color);">

							<p class="post-description" th:if="${post.description.length() <= 400}"
								th:utext="${post.description}"
								style="text-align: left; overflow: hidden; font-size: 1rem;">
							</p>

							<p class="post-description" th:if="${post.description.length() > 400}"
								style="text-align: left; overflow: hidden; font-size: 1rem;">
								<span th:utext="${post.description.substring(0, 400)}"></span>
								<span class="more-text" style="display: none;"
									th:utext="${post.description.length() > 2500 ? post.description.substring(400, 2500) : post.description.substring(400)}"></span>
								<button class="toggle-button"
									style="width:auto; background: var(--accent-color); color: var(--button-text); border: none; padding: 5px 10px; border-radius: 5px;"
									onclick="toggleReadMore(this)">
									Read more...
								</button>
							</p>

						</div>

						<img th:if="${post.media != null and post.media != ''}" th:src="${post.media}" alt="Post Image"
							class="col-12" />

					</div>

				</div>
			</div>
			<div class="post-actions d-flex border-top pt-3"
				style="margin-top:0; gap: 5px; justify-content: center; border-color: var(--border-color);">
				<button class="articleid" th:text="${post.articleid}" style="display : none; "></button>
				<button
					th:class="'like oper btn btn-dark d-flex align-items-center justify-content-center ' + (${ post.disable != null && post.disable == true ? 'disabled' : '' })"
					style="gap: 5px;">
					<i th:class="${post.isLiked == true ? 'bi-hand-thumbs-up-fill' : 'bi-hand-thumbs-up'} "
						class="bi"></i> <span class="likeCount" th:text="${post.likes}"></span>
				</button>
				<button
					th:class="'dislike oper btn btn-dark d-flex align-items-center justify-content-center ' + (${ post.disable != null && post.disable == true ? 'disabled' : '' })"
					style="gap: 5px;">
					<i th:class="${post.isDisliked == true ? 'bi-hand-thumbs-down-fill' : 'bi-hand-thumbs-down'}"
						class="bi"></i> <span class="dislikeCount" th:text="${post.dislikes}"></span>
				</button>
				<button
					th:class="'commentBox btn btn-dark d-flex align-items-center justify-content-center ' + (${ post.disable != null && post.disable == true ? 'disabled' : '' })"
					style="gap: 5px; position:static; " onclick="requestComments(this, 'open');">
					<i class="bi bi-chat"></i><span th:text="${post.comments}"></span>
				</button>
				<button
					th:class="'btn btn-dark d-flex align-items-center justify-content-center ' + (${ post.disable != null && post.disable == true ? 'disabled' : '' })"
					style="gap: 5px;">
					<i class="bi bi-reply"></i>
				</button>
				<button
					th:class="'btn btn-dark d-flex align-items-center justify-content-center ' + (${ post.disable != null && post.disable == true ? 'disabled' : '' })"
					style="gap: 5px; "
					th:attr="onclick=${post.articleid != null} ? 'watchPost(' + ${post.articleid} + ')' : null">
					<i class="bi bi-share"></i>
				</button>
			</div>
			<div class="postComments card mt-3 mb-3 p-3" style="display: none; ">
				<div class="container" th:if="${#lists.isEmpty(post.postComments)}">
					<h3 class="post-title"> Anybody hasn't shared their thoughts. </h3>
				</div>
				<div th:if="${!#lists.isEmpty(post.postComments)}" th:each="comment : ${post.postComments}"
					class="container mb-3">
					<div class="author-box ">
						<div class="author-profile">
							<img th:src="${comment.image != null && comment.image != '' ? comment.image : '/images/logo.jpg'}"
								alt="Author Profile Picture" class="author-image">
						</div>
						<div class="author-details">
							<h3 class="author-name" th:text="${comment.name} + ' says, '"></h3>
							<!-- span th:text="'@'+${comment.username}"></span -->
							<p class="comment-text py-2" th:text="${comment.comment}"></p>
						</div>
					</div>
				</div>
			</div>
			<div th:if="${ post.disable == null or post.disable == false}" class="mycard mt-1 mb-3 d-flex"
				id="remaining"
				style="flex-direction: row; flex-wrap: wrap; min-height: 50px; border-radius: 5px; padding: 10px; ">
				<div class="d-flex flex-grow-1">
					<img th:src="${personalImage != null && personalImage != '' ? personalImage : '/images/logo.jpg'}"
						alt="User" class="rounded-circle me-2" style="width: 50px; height: 50px; object-fit: cover;">
					<input type="text" placeholder="Write a comment..." class="comment form-control mb-2"
						style="width: 80%;border-radius: 2rem;box-shadow: none;">
					<button class="btn btn-info"
						th:attr="onclick=${post.articleid != null} ? 'sendComment( this,' + ${post.articleid} + ' )' : null"
						style="margin-left: auto; width: 9%; height: 50px; border-radius: 2rem; ">
						<i class="bi bi-send-fill"></i>
					</button>
				</div>
			</div>
			<div class="mycard d-flex" id="remaining"
				style="flex-direction: row; flex-wrap: wrap; min-height: 50px; background-color: var(--bg-container); border: 1px solid var(--border-color); border-radius: 5px; padding: 10px;">
				<div th:if="${#lists.isEmpty(post.keywords)}">
					<h2 style="display: inline; color: var(--secondary-text);">Keywords Not Selected</h2>
				</div>
				<div th:if="${!#lists.isEmpty(post.keywords)}">
					<h2 style="display: inline; color: #5c5b5b;">Keywords: </h2>
				</div>
				<th:block th:each="keyword, iterStat : ${post.keywords}">
					<button th:class="'tag color-' + ${iterStat.index % colors.size()} + '-clicked'" th:attr="data-keyword=${keyword}"
						th:attrappend="data-url='/mass-filter/keyword/' + ${keyword}" class="tag" th:text="${keyword}"
						style="background-color: var(--button-bg); color: var(--button-text); border: none; border-radius: 5px; padding: 5px 10px;">
					</button>
				</th:block>
			</div>
		</div>

		<div class="post-metadata">
			<div class="author-info">
				<span class="author-bio" th:text="'@' + ${post.username}"></span>
			</div>
			<div class="post-date">
				<i class="bi bi-calendar-fill" style=" margin-right : 5px; "></i>
				<span class="date-text"
					th:text=" ${post.status == 'draft' ? 'Drafted on ' : ''} + ${post.status == 'published' ? 'Published on ' : ''} + ${post.updatedat}"></span>
			</div>
		</div>
	</div>
</div>
</div>
</div>
