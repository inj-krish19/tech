<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Review Post - Tech2xplore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<style>

</style>
<body>

		<style th:each="color, iterStat : ${colors}">
        .color-[[${iterStat.index}]] {
            background-color: white;
            border : 1px solid [[${color}]];
            color : [[${color}]];
        }
        .color-[[${iterStat.index}]]:hover {
            background-color : [[${color}]];
            color: white;
            border: 1px solid [[${color}]];
        }
        
        .color-[[${iterStat.index}]]:click {
            background-color : [[${color}]];
            color: white;
            border: 1px solid [[${color}]];
        }
        
        .color-[[${iterStat.index}]]-clicked {
            background-color : [[${color}]];
            color: white;
            border: 1px solid [[${color}]];
        }
    </style>

    <div th:replace="~{header :: nav}"></div>
    <div class="post-card" style="max-width: 800px;">
        
        <div class="post-content" id="post-content">
            <div class="container">

                <div class="author-box">
                    <div class="author-profile">
                        <img th:src="@{images/logo.jpg}" alt="Author Profile Picture" class="author-image">
                    </div>
                    <div class="author-details">
                        <h3 class="author-name" th:text="${post.name}"></h3><span th:text="'@' + ${post.username}"></span> 
                        <p class="author-bio" th:text="${post.bio}"></p>
                    </div>
                </div>
                
                <div class="d-flex text-center">
                
	                <h2 class="post-title" th:text="${post.title}"></h2>
	
	                <div class="post-category" style="margin-top : auto; margin-bottom: auto; ">
	                    <span class="category-name" th:text="${post.category}"></span>
	                </div>
	                
                </div>

				<div th:classappend="${#strings.length(post.description) > 1000} ? 'post-image-large' : 'post-image-flex'"
					class="post-image">
					<img th:if="${post.image != null}" th:src="@{images/logo.jpg}" alt="Post Image"
						th:style="${#strings.length(post.description) > 1000} ? 'width: inherit; height: inherit;' : 'width: 300px; height: 300px;'" />

					<div class="post-content" style="overflow-wrap:anywhere;">
						<p class="post-description" th:text="${post.description}"
							th:if="${post.description.length() <= 1000}" style="text-align: left;">
						</p>

						<p class="post-description" th:if="${post.description.length() > 1000}"
							style="text-align: left;">
							<span th:text="${post.description.substring(0, 2500)}"></span>
							<span class="more-text" style="display: none;"
								th:text="${post.description.substring(2500)}"></span>
							<button class="toggle-button" onclick="toggleReadMore(this)">Read more...</button>
						</p>

					</div>
				</div>
				
				<div class="mycard d-flex" id="remaining" style="flex-direction: row; flex-wrap: wrap; min-height: 50px;">
				    <div th:if="${#lists.isEmpty(post.keywords)}">
					    <h2 style="display: inline; color: #5c5b5b;" >Keywords Not Selected</h2>
					</div>
					<div th:if="${!#lists.isEmpty(post.keywords)}">
					    <h2 style="display: inline; color: #5c5b5b;">Keywords: </h2>
					</div>
				    <th:block th:each="keyword, iterStat : ${post.keywords}">
				        <button th:class="'tag color-' + ${post.buttonIndex.get(iterStat.index)} + '-clicked'" 
				                th:attr="data-keyword=${keyword}"
				                class="tag" 
				                th:text="${keyword}" >
				        </button>
				    </th:block>
				</div>

                <div class="post-metadata">
                    <div class="author-info">
                        <i class="icon-user"></i>
                        <span class="author-bio" th:text="'inj_krish19'"></span>
                    </div>
                    <div class="post-date">
                        <i class="icon-calendar"></i>
                        <span class="date-text" th:text="'14 - 11 - 2024 12:00:00'"></span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="post-actions">
                    <form th:action="@{/doPost}" method="post">
                        <input type="hidden" name="title" th:value="${post.title}" />
                        <input type="hidden" name="category" th:value="${post.category}" />
                        <input type="hidden" name="description" th:value="${post.description}" />
                        <input type="hidden" name="keyword" th:value="${post.keyword}" />
                        <button type="submit" class="btn-confirm" onclick="hidePost()">Confirm</button>
                    </form>
                    <a href="/create_post" class="btn-cancel" style="margin-top: 5px; height:100%;">Cancel</a>
                </div>
            </div>
        </div>
        <div class="justify-content-center mt-5 mb-5 "  style="font-size:1.75rem;	display :none; " id="loader" >
	           <div class="alert alert-success text-center" role="alert">
	                <span>Uploading ...</span>
	          		<div class="spinner-border text-success"role="status">
					  <span class="sr-only">Loading...</span>
					</div>
	           </div>
		</div>
    </div>
    
    <div th:replace="~{footer :: div}"></div>

	<script>
	
		function hidePost(){
			
			const postContent = document.getElementById("post-content");
			const loader = document.getElementById("loader");
			
			postContent.style.display = "none";
			loader.style.display = "show";
			loader.classList.add("d-flex");
			
		}
	
	</script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/scripts.js"></script>

</body>

</html>
