<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Review </title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="/css/style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<style>

</style>

<body>
   	
<style th:each="color, iterStat : ${colors}">
	.color-[[${iterStat.index}]] {
	    background-color: white;
	    border : 1px solid [[${color}]];
	    color : [[${color}]];
	}
	.color-[[${iterStat.index}]]:hover {
	    background-color : [[${color}]];
	    color: white;
	    border: 1px solid [[${color}]];
	}
	
	.color-[[${iterStat.index}]]:click {
	    background-color : [[${color}]];
	    color: white;
	    border: 1px solid [[${color}]];
	}
	
	.color-[[${iterStat.index}]]-clicked {
	    background-color : [[${color}]];
	    color: white;
	    border: 1px solid [[${color}]];
	}
</style>
	<div th:replace="~{header :: nav}"></div>
	<div class="post-card" style="max-width: 800px;">

		<div class="alert alert-info" style="display : none; " id="alertMessage" role="alert">
			<span>Post saved as Draft</span>
		</div>
		<div class="post-content" id="post-content">
			<div class="container">

				<div th:replace="~{post :: div} "></div>

				<!-- Action Buttons -->
				<div class="post-actions">
					<form th:action="@{/doPost}" method="post">
						<input type="hidden" name="id" th:value="${articleid}" />
						<button type="submit" class="btn-confirm" onclick="hidePost()">Confirm</button>
					</form>
					<a onclick="cancel(event)" class="btn-cancel" style="margin-top: 5px; height:100%;">Cancel</a>
				</div>
			</div>
		</div>
		<div class="justify-content-center mt-5 mb-5 " style="font-size:1.75rem;	display :none; " id="loader">
			<div class="alert alert-success text-center" role="alert">
				<span id="content">Publishing Post ...</span>
				<div class="spinner-border text-success" role="status">
					<span class="sr-only">Loading...</span>
				</div>
			</div>
		</div>
	</div>

	<div th:replace="~{footer :: div}"></div>

	<script>

		function cancel(event) {

			if (event) {
				event.preventDefault(); // Prevent default anchor behavior
			}

			const message = document.getElementById("alertMessage");
			const content = document.getElementById("content");
			content.innerHTML = "Saving as Draft ...";

			hidePost();
			message.style.display = "block";
			setTimeout(() => {
				location.href = "/myposts";
			}, 3000);

		}

		function hidePost() {

			const postContent = document.getElementById("post-content");
			const loader = document.getElementById("loader");

			postContent.style.display = "none";
			loader.style.display = "show";
			loader.classList.add("d-flex");

		}

	</script>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/js/scripts.js"></script>

</body>

</html>
