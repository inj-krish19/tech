<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" style="background: #343a40;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, shrink-to-fit=no">
    <title>Create Post - Tech2xplore</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">



    <style>
        body {
            background-color: #343a40;
            /* Dark background for the body */
            height: auto;
        }

        .card {
            background-color: white;
            /* White background for the card */
            color: #212529;
            /* Dark text color for better visibility */
        }
        
        .tag {
            display: inline-block;
            font-weight : 600;
            color: white;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 25px;
            width: fit-content;
        }
        		        
    </style>
</head>

<body>

	<style th:each="color, iterStat : ${colors}">
        .color-[[${iterStat.index}]] {
            background-color: white;
            border : 1px solid [[${color}]];
            color : [[${color}]];
        }
        .color-[[${iterStat.index}]]:hover {
            background-color : [[${color}]];
            color: white;
            border: 1px solid [[${color}]];
        }
        
        .color-[[${iterStat.index}]]:click {
            background-color : [[${color}]];
            color: white;
            border: 1px solid [[${color}]];
        }
        
        .color-[[${iterStat.index}]]-clicked {
            background-color : [[${color}]];
            color: white;
            border: 1px solid [[${color}]];
        }
    </style>

    <div th:replace="~{header :: nav}"></div>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card shadow-lg border-light">
                    <div class="card-body p-4" style="background: grey;">
                        <h2 class="text-center">Create Post</h2>
                        <form th:action="@{/review}" method="post" enctype="multipart/form-data">


                            <div class="mb-3">
                                <label for="category" class="form-label">Category</label>
                                <select class="form-select" id="category" name="category" required>
                                    <option value="">Select a category</option>
                                    <th:block th:each="category : ${categories}">
                                        <option th:value="${category}" th:text="${category}"></option>
                                    </th:block>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="title" class="form-label">Title</label>
                                <input type="text" class="form-control" id="title" name="title" required>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Body</label>
                                <div id="editor" style="min-height: 150px;"></div>
                                <input type="hidden" name="description" id="body-input" required>
                            </div>

                            <div class="mb-3">
                                <label for="image" class="form-label">Image</label>
                                <input type="file" class="form-control" id="image" name="image" accept="image/*"
                                    onchange="previewImage(event)">
                                <img id="image-preview" src="" alt="Image Preview" class="img-fluid mt-2"
                                    style="display: none; max-width: 100%;">
                            </div>

                            <div class="form-check mb-3">
                                <input type="checkbox" class="form-check-input" id="public" name="public">
                                <label class="form-check-label" for="public">Public</label>
                            </div>

                            <div class="form-check mb-3">
                                <input type="checkbox" class="form-check-input" id="private" name="private">
                                <label class="form-check-label" for="private">Private</label>
                            </div>

							<input type="hidden" id="selectedKeywords" name="selectedKeywords" value="">

							<div class="d-flex mb-3">
							    <label class="form-label">Selected Keywords</label>
							</div>
							<div class="card d-flex" id="selected" style="flex-direction: row; flex-wrap: wrap; min-height: 50px;">
							    <!-- Selected keywords will appear here -->
							</div>
							
							<div class="d-flex mb-3">
							    <label class="form-label">Remaining Keywords</label>
							</div>
							<div class="card d-flex" id="remaining" style="flex-direction: row; flex-wrap: wrap; min-height: 50px;">
							    <th:block th:each="keyword, iterStat : ${keywords}">
							        <button th:class="'tag color-' + ${iterStat.index}" 
							                th:attr="data-keyword=${keyword}" 
							                class="tag" 
							                th:text="${keyword}" 
							                onclick="selectKeyword(this, event)">
							        </button>
							    </th:block>
							</div>
							
                            <button type="submit" class="btn btn-primary w-100">Save Post</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{footer :: div}"></div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/scripts.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    
    const selected = document.getElementById("selected");
    const remaining = document.getElementById("remaining");
    const selectedKeywordsField = document.getElementById("selectedKeywords");

    function selectKeyword(button, event) {
        event.preventDefault(); // Prevent form submission

        const keyword = button.getAttribute('data-keyword');
        let selectedKeywords = selectedKeywordsField.value ? selectedKeywordsField.value.split(',') : [];

        if (!selectedKeywords.includes(keyword)) {
        	
        	const classList = Array.from(button.classList);

        	for (let i = 0; i < classList.length; i++) {
        	    const splitClass = classList[i].split("-");
        	    if (splitClass.length > 1) {
        	        selectedKeywords.push(keyword + "-" + splitClass[1]);
        	        break;
        	    }
        	}
        	
            button.innerHTML = `${keyword} <span onclick="removeKeyword(this.parentNode, event); event.stopPropagation();">❌</span>`;
            button.classList.toggle('liked');
            button.setAttribute('onclick', 'removeKeyword(this, event)');
            selected.appendChild(button);
        }
        toggleClass(button)

        selectedKeywordsField.value = selectedKeywords.join(',');
        console.log('Selected Keywords:', selectedKeywords);
    }

    function removeKeyword(button, event) {
        event.preventDefault(); // Prevent form submission
        event.stopPropagation(); // Prevent triggering selectKeyword

        const keyword = button.getAttribute('data-keyword');
        let selectedKeywords = selectedKeywordsField.value ? selectedKeywordsField.value.split(',') : [];

        console.log( "Keyword : " + keyword );
        
        selectedKeywords = selectedKeywords.filter(k => !k.startsWith(keyword));
        button.innerHTML = keyword;
        button.setAttribute('onclick', 'selectKeyword(this, event)');

        // Insert button at the correct position in "remaining" to preserve order
        const allRemainingButtons = Array.from(remaining.children);
        let inserted = false;
        for (let i = 0; i < allRemainingButtons.length; i++) {
            if (keyword.localeCompare(allRemainingButtons[i].getAttribute('data-keyword')) < 0) {
                remaining.insertBefore(button, allRemainingButtons[i]);
                inserted = true;
                break;
            }
        }
        if (!inserted) {
            remaining.appendChild(button);
        }

        toggleClass(button)
        selectedKeywordsField.value = selectedKeywords.join(',');
        console.log('Remaining Keywords:', selectedKeywords);
    }

	function toggleClass(button){
		const classList = Array.from(button.classList);
		console.log(classList);
	    classList.forEach(cls => {
	    	if(cls.endsWith('-clicked')){
	            button.classList.toggle(cls);
	            button.classList.toggle(cls.substring(0, cls.length - 8));
	            return;
	        }
	        if (cls.startsWith("color-")) {
	            button.classList.toggle(cls);
	            button.classList.toggle(cls + "-clicked");
	            return;
	        }
	    });
	}
    	
        // Preview Image Function
        function previewImage(event) {
            const imagePreview = document.getElementById('image-preview');
            imagePreview.src = URL.createObjectURL(event.target.files[0]);
            imagePreview.style.display = 'block';
        }

        // Quill Editor Initialization
        document.addEventListener('DOMContentLoaded', function () {
            var quill = new Quill('#editor', {
                theme: 'snow',
                modules: {
                    toolbar: [
                        [{ 'font': [] }, { 'size': [] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'color': [] }, { 'background': [] }],
                        [{ 'script': 'sub' }, { 'script': 'super' }],
                        ['blockquote', 'code-block'],
                        [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                        [{ 'align': [] }],
                        ['link', 'image'],
                        ['emoji']
                    ]
                }
            });

            const form = document.querySelector('form');
            form.onsubmit = function () {
                document.querySelector('#body-input').value = quill.root.innerHTML;
            };
        });

        $(document).ready(function () {
            let selectedTags = [];

            // Toggle button style and manage selected tags
            $('.tag-btn').on('click', function () {
                const tagName = $(this).data('tag');

                if ($(this).hasClass('btn-outline-primary')) {
                    $(this).removeClass('btn-outline-primary').addClass('btn-primary');
                    selectedTags.push(tagName);
                } else {
                    $(this).removeClass('btn-primary').addClass('btn-outline-primary');
                    selectedTags = selectedTags.filter(tag => tag !== tagName);
                }
            });

            // Handle form submission
            $('#myForm').on('submit', function (e) {
                e.preventDefault();

                // Prepare the data to be sent
                const tagsString = selectedTags.join(',');
                const formData = {
                    tags: tagsString,
                    otherParam: 'someValue'  // Add other parameters here
                };

                console.log('Form Data: ', formData);

                // Send a POST request (replace with your URL)
                $.ajax({
                    url: '/your-api-endpoint',  // Replace with your API endpoint
                    type: 'POST',
                    data: formData,
                    success: function (response) {
                        alert('Form successfully submitted!');
                    },
                    error: function (error) {
                        alert('Error submitting form');
                    }
                });
            });
        });
    </script>
</body>

</html>
