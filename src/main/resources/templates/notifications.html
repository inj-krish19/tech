<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" style="background: #343a40;">

<head>
	<title>Error</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="/css/style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>

<body style="background:#343a40">

	<div th:replace="~{header :: nav}"></div>

	<div class="container mt-5">
		
		<div class="posts-list" id="post-container">
			<div th:if="${#lists.isEmpty(notifications)}" 
			class="alert alert-dark text-center">
		    	<h2 th:text="${news != null ? news : 'No Activity Spotted'}"></h2>
			</div>
			<div th:each="{notification : ${notifications}}" class="container">
				<div class="author-box">
					<div class="author-profile">
						<img th:src="${notification.image != null && notification.image != '' ? notification.image : '/images/logo.jpg'}"
						 alt="Author Profile Picture" class="author-image">
					</div>
					<div class="author-details">
						<h3 class="author-name" th:text="${notification.name}"></h3>
						<span th:text="'@'+${notification.username}"></span>
						<p class="author-bio" th:text="${notification.bio}"></p>
					</div>
				</div>
				<div class="post-header d-flex align-items-center">
					<h2 class="post-title mb-0" th:text="${notification.name} + ' wants to connect with you.'"></h2>
				</div>
			</div>
		</div>

	</div>


	<div th:replace="~{footer :: div}"></div>

</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/scripts.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


</html>
