<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}"> <!-- Include your custom stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>

	<div id="preloader">
	    <div class="loader-container">
	        <div class="spinner"></div>
	        <div class="loader-text">Loading...</div>
	    </div>
	</div>

	<div id="toast" style="visibility:hidden; min-width:200px; background:#333; color:#fff; text-align:center; border-radius:5px; padding:10px; position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000;">
	  Copied to clipboard!
	</div>
	
    <div th:replace="~{header :: nav}"></div>
	
	<div class="container mt-5 d-flex justify-content-center">
    	<div class="col-md-6">
        	<div class="mycard">
            
	            <!-- Card Header -->
	            <div class="text-center border-bottom">
	                <h2 class="card-title m-2">Login</h2>
	            </div>
	
	            <!-- Success Message -->
				<div th:if="${param.success}" class="alert alert-success text-center" role="alert">
	                <span th:text="'Login successful! You are redirected at Home Page In 3 Seconds ...'"></span>
	            </div>
	
	            <div class="card-body" id="login">

                <!-- Error Message -->
                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    <span th:text="'Login failed. Please check your username and password.'"></span>
                </div>

                <!-- Logout Message -->
                <div th:if="${param.logout}" class="alert alert-primary" role="alert">
                    <span th:text="'Logout Successfully.'"></span>
                </div>

            <!-- Login Form -->
	            <div class="card-body p-3" id="login">
	                <form th:action="@{/login}" method="post">
	
	                    <div class="mb-3">
	                        <label for="username" class="username">Username</label>
	                        <input type="text" class="form-control" id="username" name="username" required>
	                    </div>
	
	                    <div class="mb-3">
	                        <label for="password" class="username">Password</label>
	                        <input type="password" class="form-control" id="password" name="password" required>
	                    </div>
	
	                    <button type="submit" class="tag w-100 mt-3">Login</button>
	                </form>
	
	                <div class="mt-4 text-center">
	                    <a href="/register" class="link">Don't have an account? Sign Up</a>
	                </div>
					
					<div class="mt-2 text-center">
						<a href="/change" class="link">Forgot Password? Change Password</a>
					</div>
	            </div>
			</div>
            <!-- Loader -->
			<div class="justify-content-center mt-5 mb-5" style="display: none;" id="loader">
                <div class="spinner-border text-success" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>
</div>

    <div th:replace="~{footer :: div}"></div>

    <script>

        let queryParameters = window.location.search.substring(1);

        const queries = queryParameters.split("&")

        for (let query of queries) {
            const [key, value] = query.split("=");
            if (key === "success" && value === "true") {
                const loader = document.getElementById("loader");
                const login = document.getElementById("login");
                login.style.display = "none";
                loader.style.display = "show";
                loader.classList.add("d-flex");
                setTimeout(
                    () => {
                        window.location.href = "/";
                    }, 3000
                );
                break;
            }
        }

    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/scripts.js"></script>
</body>

</html>
