<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" style="background: #343a40;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login - Tech2xplore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}"> <!-- Include your custom stylesheet -->
    <link rel="stylesheet" th:href="@{/css/login.css}"> <!-- Include your custom stylesheet for login -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"> <!-- Bootstrap Icons -->
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-expand-lg navbar-light">
		<div class="container-fluid">
			<a class="navbar-brand logo-text" href="/">Tech2<span>xplore</span></a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item">
						<a class="nav-link" href="/about"><i class="bi bi-info-circle"></i> About Us</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="/bloggers"><i class="bi bi-person-badge"></i> Bloggers</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="/posts"><i class="bi bi-person-badge"></i> Posts</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="/create_post"><i class="bi bi-arrow-in-down"></i> New Post</a>
					</li>

					<!-- Login and Sign Up options for unauthenticated users -->
					<li class="nav-item" th:if="${loggedInUser == null}">
						<a class="nav-link" href="/login"><i class="bi bi-box-arrow-in-right"></i> Login</a>
					</li>
					<li class="nav-item" th:if="${loggedInUser == null}">
						<a class="nav-link" href="/register"><i class="bi bi-person-plus"></i> Sign Up</a>
					</li>

					<!-- Options for authenticated users -->
					<li class="nav-item dropdown" th:if="${loggedInUser != null}">
						<a class="nav-link dropdown-toggle" href="#" id="navbarProfileDropdown" role="button"
							data-bs-toggle="dropdown" aria-expanded="false">
							<i class="bi bi-person-circle"></i> Profile
						</a>
						<ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarProfileDropdown">
							<li><a class="dropdown-item" href="/profile"><i class="bi bi-person-circle"></i> Profile</a>
							</li>
							<li><a class="dropdown-item" href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
							</li>
						</ul>
					</li>

					<!-- Post option for authenticated users -->
					<li class="nav-item" th:if="${loggedInUser != null}">
						<a class="nav-link" href="/create_post"><i class="bi bi-pencil-square"></i> Create Post</a>
					</li>

					<!-- My Posts option for authenticated users -->
					<li class="nav-item" th:if="${loggedInUser != null}">
						<a class="nav-link" href="/posts"><i class="bi bi-file-earmark-post"></i> My Posts</a>
					</li>

				</ul>
			</div>
		</div>
	</nav>

<div class="container mt-5 d-flex justify-content-center">
    <div class="col-md-6">
        <div class="card bg-secondary border-light">
            <div class="card-header text-center">
                <h2 class="mb-0">Login</h2>
            </div>
            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <span th:text="${error}"></span>
                </div>
                <form th:action="@{/login}" method="post">
					<div class="mb-3">
					    <label for="username" class="form-label">Username</label>
					    <input type="text" class="form-control" id="username" name="username" required>
					</div>
					<div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="/register" class="text-light">Don't have an account? Sign Up</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
