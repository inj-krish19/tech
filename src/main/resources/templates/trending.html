<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, shrink-to-fit=no">
	<title>Trending News </title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="/css/style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>
<style th:each="color, iterStat : ${colors}">
	.color--[[${iterStat.index}]]:hover {
	    color : [[${color}]];
	    font-weight: 900;
	}
	.color--[[${iterStat.index}]] {
		font-weight: 600;
		transition : 0.3s;
		color : #5c5b5b;
	}
</style>
   
   	
<style th:each="color, iterStat : ${colors}">
	.color-[[${iterStat.index}]] {
	    background-color: white;
	    border : 1px solid [[${color}]];
	    color : [[${color}]];
	}
	.color-[[${iterStat.index}]]:hover {
	    background-color : [[${color}]];
	    color: white;
	    border: 1px solid [[${color}]];
	}
	
	.color-[[${iterStat.index}]]:click {
	    background-color : [[${color}]];
	    color: white;
	    border: 1px solid [[${color}]];
	}
	
	.color-[[${iterStat.index}]]-clicked {
	    background-color : [[${color}]];
	    color: white;
	    border: 1px solid [[${color}]];
	}
</style>
<body>

	<div th:replace="~{header :: nav}"></div>
	<div class="container mt-5">
		<h1>Trending News with News API</h1>
	</div>

	<div class="container">
		<div class="row">
			<div class="col-md-8">
				<div class="slider-container">
					<div id="imageCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="7000">
						<div class="carousel-inner">
							<div class="carousel-item active">
								<img src="https://i0.wp.com/newsdata.io/blog/wp-content/uploads/2024/01/Snipaste_2021-11-28_13-55-49.jpg?fit=701%2C351&ssl=1"
									class="d-block w-100" alt="Image 1">
							</div>
							<div class="carousel-item">
								<img th:src="@{images/logo.jpg}" class="d-block w-100" alt="Image 2">
							</div>
							<div class="carousel-item">
								<img src="https://i0.wp.com/newsdata.io/blog/wp-content/uploads/2024/01/Snipaste_2021-11-28_13-55-49.jpg?fit=701%2C351&ssl=1"
									class="d-block w-100" alt="Image 3">
							</div>
							<div class="carousel-item">
								<img th:src="@{images/logo.jpg}" class="d-block w-100" alt="Image 4">
							</div>
						</div>
						<button class="carousel-control-prev" type="button" data-bs-target="#imageCarousel"
							data-bs-slide="prev">
							<span class="carousel-control-prev-icon" aria-hidden="true"></span>
							<span class="visually-hidden">Previous</span>
						</button>
						<button class="carousel-control-next" type="button" data-bs-target="#imageCarousel"
							data-bs-slide="next">
							<span class="carousel-control-next-icon" aria-hidden="true"></span>
							<span class="visually-hidden">Next</span>
						</button>
					</div>
				</div>
			</div>


			<div class="col-md-4">
				<div class="content">
					<div class="slider">
						<div class="search-div">
							<form th:action="@{/search}" method="post">
								<input type="text" name="keyword" class="text-input" placeholder="Search...">
							</form>
						</div>
						<!-- // Search -->
						<!-- topics -->
						<div class="section topics">
							<h2>Topics</h2>
							<div th:if="${#lists.isEmpty(topics)}" class="not-found-message">
								<h2>Categories Are Not Available</h2>
							</div>
							<hr class="black-hr">
							<ul style="list-style:none;">
								<li th:each="topic, iterStat : ${topics}"
									style="color: #5c5b5b; text-decoration: double; font-weight:bolder;">
									<a th:text="${topic}" th:href="@{'/filter/category/' + ${topic}}"
										th:class="'tag color--' + ${iterStat.index}"></a>
									<hr>
								</li>
							</ul>
						</div>
					</div>
				</div>
				<!-- // topics -->
			</div>
		</div>
	</div>


	<div class="container" style="margin-left:5%;">
		<div class="page-content">
			<h1 class="recent-posts-title text-center">Trending News</h1>
			<div th:replace="~{post :: div}"></div>
			<div style="width:62%; margin-left:19%; display: none; " class="alert alert-info text-center" role="alert"
				id="alertMessage">
				<span id="content">Enough Trending News for Today! You are redirected at Home Page In 3 Seconds
					...</span>
			</div>
		</div>
		<div class="justify-content-center mt-5 mb-5 mx-auto"  style="display :none; width: fit-content;" id="loader" >
              <div class="spinner-border text-dark"role="status">
			  <span class="sr-only">Loading...</span>
			</div>
		</div>
		<div class="posts-list mx-auto">
	        <button id="load-more" onclick="loadMorePosts()">Load More</button>
    	</div>
	</div>

	<div th:replace="~{footer :: div}"></div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/js/scripts.js"></script>

	<script>
		let currentPage = 1;
		const pageSize = 15; // Number of posts to load per request
		const loader = document.getElementById("loader");
		const loadMore = document.getElementById("load-more");
		const posts = document.getElementById("post-container");
		const message = document.getElementById("alertMessage");
		const content = document.getElementById("content");
		var redirectHome = null;

		function loadMorePosts() {
		    loader.style.display = "show";
		    loader.classList.add("d-flex");
		    loadMore.style.display = "none";

		    currentPage++;

		    fetch(`/trending-more-posts2?page=${currentPage}`)
		        .then(response => {
		            if (!response.ok) {
		                throw new Error(`Network response was not ok: ${response.statusText}`);
		            }
		            return response.text();  // IMPORTANT: Get text not JSON
		        })
		        .then(html => {
					console.log(html);
		            const postContainer = document.getElementById("post-container");
		            const tempDiv = document.createElement("div");
		            tempDiv.innerHTML = html;

		            // 🔥 Pick only `.post` elements (not outer div)
		            const newPosts = tempDiv.querySelectorAll(".post");
		            newPosts.forEach(post => {
		                postContainer.appendChild(post);

		                post.style.opacity = 0;
		                setTimeout(() => {
		                    post.style.transition = "opacity 0.5s ease";
		                    post.style.opacity = 1;
		                }, 50);
		            });

		            loader.style.display = "none";
		            loadMore.style.display = newPosts.length > 0 ? "block" : "none";

		            if (newPosts.length === 0) {
		                const noMore = document.createElement("p");
		                noMore.className = "text-center text-muted mt-2";
		                noMore.textContent = "No more posts to load.";
		                postContainer.appendChild(noMore);
		            }
		        })
		        .catch(error => {
					console.error('Error loading more posts:', error);
                    posts.style.display = "none";
                    message.style.display = "block";
                    setTimeout(() => window.location.href = '/login', 3000);
		        })
				.finally( () => {
                    loader.style.display = "none";
                    loader.classList.remove("d-flex");
                	loadMore.style.display = "block";
            	});
            
		}

	</script>

</body>

</html>
