<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, shrink-to-fit=no">
	<title>Trending News </title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="/css/style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>
<style th:each="color, iterStat : ${colors}">
	.color--[[${iterStat.index}]]:hover {
	    color : [[${color}]];
	    font-weight: 900;
	}
	.color--[[${iterStat.index}]] {
		font-weight: 600;
		transition : 0.3s;
		color : #5c5b5b;
	}
</style>
   
   	
<style th:each="color, iterStat : ${colors}">
	.color-[[${iterStat.index}]] {
	    background-color: white;
	    border : 1px solid [[${color}]];
	    color : [[${color}]];
	}
	.color-[[${iterStat.index}]]:hover {
	    background-color : [[${color}]];
	    color: white;
	    border: 1px solid [[${color}]];
	}
	
	.color-[[${iterStat.index}]]:click {
	    background-color : [[${color}]];
	    color: white;
	    border: 1px solid [[${color}]];
	}
	
	.color-[[${iterStat.index}]]-clicked {
	    background-color : [[${color}]];
	    color: white;
	    border: 1px solid [[${color}]];
	}
</style>
<body>

	<div th:replace="~{header :: nav}"></div>
	<div class="container mt-5">
		<h1>Trending News with News API</h1>
	</div>

	<div class="container">
		<div class="row">
			<div class="col-md-8">
				<div class="slider-container">
					<div id="imageCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="7000">
						<div class="carousel-inner">
							<div class="carousel-item active">
								<img src="https://i0.wp.com/newsdata.io/blog/wp-content/uploads/2024/01/Snipaste_2021-11-28_13-55-49.jpg?fit=701%2C351&ssl=1"
									class="d-block w-100" alt="Image 1">
							</div>
							<div class="carousel-item">
								<img th:src="@{images/logo.jpg}" class="d-block w-100" alt="Image 2">
							</div>
							<div class="carousel-item">
								<img src="https://i0.wp.com/newsdata.io/blog/wp-content/uploads/2024/01/Snipaste_2021-11-28_13-55-49.jpg?fit=701%2C351&ssl=1"
									class="d-block w-100" alt="Image 3">
							</div>
							<div class="carousel-item">
								<img th:src="@{images/logo.jpg}" class="d-block w-100" alt="Image 4">
							</div>
						</div>
						<button class="carousel-control-prev" type="button" data-bs-target="#imageCarousel"
							data-bs-slide="prev">
							<span class="carousel-control-prev-icon" aria-hidden="true"></span>
							<span class="visually-hidden">Previous</span>
						</button>
						<button class="carousel-control-next" type="button" data-bs-target="#imageCarousel"
							data-bs-slide="next">
							<span class="carousel-control-next-icon" aria-hidden="true"></span>
							<span class="visually-hidden">Next</span>
						</button>
					</div>
				</div>
			</div>


			<div class="col-md-4">
				<div class="content">
					<div class="slider">
						<div class="search-div">
							<form th:action="@{/search}" method="post">
								<input type="text" name="keyword" class="text-input" placeholder="Search...">
							</form>
						</div>
						<!-- // Search -->
						<!-- topics -->
						<div class="section topics">
							<h2>Topics</h2>
							<div th:if="${#lists.isEmpty(topics)}" class="not-found-message">
								<h2>Categories Are Not Available</h2>
							</div>
							<hr class="black-hr">
							<ul style="list-style:none;">
								<li th:each="topic, iterStat : ${topics}"
									style="color: #5c5b5b; text-decoration: double; font-weight:bolder;">
									<a th:text="${topic}" th:href="@{'/filter/category/' + ${topic}}"
										th:class="'tag color--' + ${iterStat.index}"></a>
									<hr>
								</li>
							</ul>
						</div>
					</div>
				</div>
				<!-- // topics -->
			</div>
		</div>
	</div>


	<div class="container" style="margin-left:5%;">
		<div class="page-content">
			<h1 class="recent-posts-title text-center">Trending News</h1>
			<div th:replace="~{post :: div}"></div>
			<div style="width:62%; margin-left:19%; display: none; " class="alert alert-info text-center" role="alert"
				id="alertMessage">
				<span id="content">Enough Trending News for Today! You are redirected at Home Page In 3 Seconds
					...</span>
			</div>
		</div>
		<div class="justify-content-center mt-5 mb-5 " style="display :none; " id="loader">
			<div class="spinner-border text-dark" role="status">
				<span class="sr-only">Loading...</span>
			</div>
		</div>
		<button id="load-more" style="width:62%; margin-left:19%;" onclick="loadMorePosts()">Load More</button>
	</div>

	<div th:replace="~{footer :: div}"></div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/js/scripts.js"></script>

	<script>
		let currentPage = 1;
		const pageSize = 15; // Number of posts to load per request
		const loader = document.getElementById("loader");
		const loadMore = document.getElementById("load-more");
		const posts = document.getElementById("post-container");
		const message = document.getElementById("alertMessage");
		const content = document.getElementById("content");
		var redirectHome = null;

		function loadMorePosts() {

			loader.style.display = "show";
			loader.classList.add("d-flex");
			loadMore.style.display = "none";

			currentPage++;
			fetch(`/trending-more-posts?page=${currentPage}`)
				.then(response => {
					if (!response.ok) {
						throw new Error(`Network response was not ok: ${response.statusText}`);
					}
					return response.json(); // Parse JSON
				})
				.then(data => {
					const postContainer = document.getElementById('post-container');

					data.posts.forEach(post => {
						const postDiv = document.createElement('div');
						postDiv.classList.add('post', 'mb-4');
						postDiv.style.maxWidth = '800px';

						postDiv.innerHTML = `
	                        <div class="post-card p-4">
	                            <div class="post-content">
	                                <div class="container">
	
	                                    <div class="author-box">
	                                        <div class="author-profile">
	                                            <img src="${post.image !== null && post.image !== '' ? post.image : '/images/logo.jpg'}"
	                                                 alt="Author Profile Picture" class="author-image">
	                                        </div>
	                                        <div class="author-details">
	                                            <h3 class="author-name">${post.name}</h3>
	                                            <span>@${post.username}</span>
	                                            <p class="author-bio">${post.bio}</p>
	                                        </div>
	                                    </div>
	
	                                    <div class="post-header d-flex align-items-center">
	                                        <h2 class="post-title mb-0">${post.title}</h2>
	                                        <div class="post-category">
	                                            <span class="badge bg-secondary">${post.category}</span>
	                                        </div>
	                                    </div>
	
	                                    <div class="row flex-col d-flex">
		                                    <img src="${post.media && post.media !== '' ? post.media : ''}" alt="Post Image" class="col-12"
		                                         style="${post.media == null || post.media === '' ? ' display: none;' : ''}">
		                                    <div class="post-content col-12 text-center" style="overflow-wrap: anywhere;">
		                                        ${post.description.length <= 1000 ? `
		                                            <p class="post-description" style="text-align: left; overflow: hidden;">
		                                                ${post.description}
		                                            </p>
		                                        ` : `
		                                            <p class="post-description" style="text-align: left; overflow: hidden;">
		                                                <span>${post.description.substring(0, 1000)}</span>
		                                                <span class="more-text" style="display: none;">
		                                                    ${post.description.length > 2500 ? post.description.substring(1000, 2500) : post.description.substring(1000)}
		                                                </span>
		                                                <button class="toggle-button" style="width:auto;" onclick="toggleReadMore(this)">Read more...</button>
		                                            </p>
		                                        `}
		                                    </div>
		                                </div>
	
		                                <div class="post-actions d-flex border-top pt-3" style="margin-top: 0; gap: 5px; justify-content: center;">
			                                <button class="articleid" style="display: none;">${post.articleid}</button>
			                                <button class="like oper btn btn-dark d-flex align-items-center justify-content-center ${post.disable ? 'disabled' : ''}" style="gap: 5px;">
			                                    <i class="${post.isLiked ? 'bi-hand-thumbs-up-fill' : 'bi-hand-thumbs-up'}"></i>
			                                    <span class="likeCount">${post.likes}</span>
			                                </button>
			                                <button class="dislike oper btn btn-dark d-flex align-items-center justify-content-center ${post.disable ? 'disabled' : ''}" style="gap: 5px;">
			                                    <i class="${post.isDisliked ? 'bi-hand-thumbs-down-fill' : 'bi-hand-thumbs-down'}"></i>
			                                    <span class="dislikeCount">${post.dislikes}</span>
			                                </button>
			                                <button class="commentBox btn btn-dark d-flex align-items-center justify-content-center ${post.disable ? 'disabled' : ''}" 
			                                        style="gap: 5px;" onclick="requestComments(this, 'open');">
			                                    <i class="bi bi-chat"></i>
			                                    <span>${post.comments}</span>
			                                </button>
			                                <button class="btn btn-dark d-flex align-items-center justify-content-center ${post.disable ? 'disabled' : ''}" style="gap: 5px;">
			                                    <i class="bi bi-reply"></i>
			                                </button>
			                                <button class="btn btn-dark d-flex align-items-center justify-content-center ${post.disable ? 'disabled' : ''}" style="gap: 5px;"
			                                        onclick="${post.articleid ? `watchPost(${post.articleid})` : ''}">
			                                    <i class="bi bi-share"></i>
			                                </button>
			                            </div>
	
	                                    <div class="postComments card mt-3 mb-3 p-3" style="display: none;">
		                                    ${post.postComments === null || post.postComments.length === 0
								? '<div class="container"><h3 class="text-info">Nobody has shared their thoughts.</h3></div>'
								: post.postComments.map(comment => `
		                                                <div class="container mb-3">
		                                                    <div class="author-box">
		                                                        <div class="author-profile">
		                                                            <img src="${comment.image ? comment.image : '/images/logo.jpg'}" 
		                                                                 alt="Author Profile Picture" class="author-image">
		                                                        </div>
		                                                        <div class="author-details">
		                                                            <h3 class="author-name">${comment.name} says,</h3>
		                                                            <p class="text-light">${comment.comment}</p>
		                                                        </div>
		                                                    </div>
		                                                </div>
		                                              `).join('')
							}
		                                </div>
	                                    
	                                    ${post.disable === null || post.disable === false
								? `<div class="mycard mt-1 mb-3 d-flex" id="remaining" style="flex-direction: row; flex-wrap: wrap; min-height: 50px; border: 1px solid #ddd; border-radius: 5px; padding: 10px; background-color: #f9f9f9;">
		                                        <div class="d-flex flex-grow-1">					    
		                                            <img src="${data.personalImage !== null && data.personalImage !== '' ? data.personalImage : '/images/logo.jpg'}" 
		                                                 alt="User" class="rounded-circle me-2" style="width: 50px; height: 50px; object-fit: cover;">
		                                            <input type="text" placeholder="Write a comment..." class="comment form-control mb-2" style="width: 80%;border-radius: 2rem;box-shadow: none;">
		                                            <button class="btn btn-info" onclick="${post.articleid ? `sendComment(this, ${post.articleid})` : ''}" style="margin-left: auto; width: 9%; height: 50px; border-radius: 2rem;">
		                                                <i class="bi bi-send-fill"></i>
		                                            </button>
		                                        </div>
		                                    </div>`
								: ``}
	
	                                    <div class="mycard d-flex" id="remaining" style="flex-direction: row; flex-wrap: wrap; min-height: 50px;">
	                                        ${post.keywords !== null && post.keywords.length !== 0
								? `<h2 style="display: inline; color: #5c5b5b;">Keywords: </h2>
	                                                ${post.keywords.map((keyword, index) => `
	                                                    <button class="tag color-${index}-clicked" data-keyword="${keyword}" data-url="/mass-filter/keyword/${keyword}" class="tag">
	                                                        ${keyword}
	                                                    </button>
	                                                `).join('')}`
								: '<h2 style="display: inline; color: #5c5b5b;">Keywords Not Selected</h2>'
							}
	                                    </div>
	
	                                </div>
	
	                                <div class="post-metadata">
	                                    <div class="author-info">
	                                        <span class="author-bio">@${post.username}</span>
	                                    </div>
	                                    <div class="post-date">
	                                        <i class="bi bi-calendar-fill" style="margin-right : 5px;"></i>
	                                        <span class="date-text">${post.status === 'draft' ? 'Drafted on ' : ''}${post.status === 'published' ? 'Published on ' : ''}${post.updatedat}</span>
	                                    </div>
	                                </div>
	
	                            </div>
	                        </div>
                			`;

						postContainer.appendChild(postDiv);
					});

					if (!data.hasMore) {
						//                        alert('No more posts!');
						redirectHome = true;
						posts.style.display = "none";
						message.style.display = "block";
						message.classList.remove("alert-warning");
						message.classList.add("alert-info");
						content.innerHTML = "No More Posts to Show :( ";
						document.getElementById('load-more').style.display = 'none';
					}
				})
				.catch(error => {
					//                    alert('Please log in to load more posts.');
					console.error('Error loading more posts:', error);
					posts.style.display = "none";
					setTimeout(() => window.location.href = '/', 3000);
					message.style.display = "block";
					redirectHome = true;
				})
				.finally(() => {
					loader.style.display = "none";
					loader.classList.remove("d-flex");
					loadMore.style.display = "block";
				});

			if (redirectHome) {
				loader.classList.add("d-flex");
				loadMore.style.display = "none";
			}

		}


	</script>

</body>

</html>
