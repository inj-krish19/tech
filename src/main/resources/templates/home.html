<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" style="background: #343a40;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, shrink-to-fit=no">
    <title>Home </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>

<style th:each="color, iterStat : ${colors}">
	.color--[[${iterStat.index}]]:hover {
	    color : [[${color}]];
	    font-weight: 900;
	}
	.color--[[${iterStat.index}]] {
		font-weight: 600;
		transition : 0.3s;
		color : #5c5b5b;
	}
</style>
   
   	
<style th:each="color, iterStat : ${colors}">
	.color-[[${iterStat.index}]] {
	    background-color: white;
	    border : 1px solid [[${color}]];
	    color : [[${color}]];
	}
	.color-[[${iterStat.index}]]:hover {
	    background-color : [[${color}]];
	    color: white;
	    border: 1px solid [[${color}]];
	}
	
	.color-[[${iterStat.index}]]:click {
	    background-color : [[${color}]];
	    color: white;
	    border: 1px solid [[${color}]];
	}
	
	.color-[[${iterStat.index}]]-clicked {
	    background-color : [[${color}]];
	    color: white;
	    border: 1px solid [[${color}]];
	}
</style>


<body style="background:#343a40">

    <div th:replace="~{header :: nav}"></div>
    <div class="container mt-5">
        <h1>Welcome to Tech2xplore</h1>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-md-8">
                <div class="slider-container">
                    <div id="imageCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="7000">
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <img th:src="@{images/logo.jpg}" class="d-block w-100" alt="Image 1">
                            </div>
                            <div class="carousel-item">
                                <img th:src="@{images/logo.jpg}" class="d-block w-100" alt="Image 2">
                            </div>
                            <div class="carousel-item">
                                <img th:src="@{images/logo.jpg}" class="d-block w-100" alt="Image 3">
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#imageCarousel"
                            data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#imageCarousel"
                            data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>
                </div>
            </div>


            <div class="col-md-4">
                <div class="content">
                    <div class="slider">
                        <div class="search-div">
                            <form th:action="@{/search}" method="post">
                                <input type="text" name="keyword" class="text-input" placeholder="Search...">
                            </form>
                        </div>
                        <!-- // Search -->
                        <!-- topics -->
                        <div class="section topics">
                            <h2>Topics</h2>
                            <div th:if="${#lists.isEmpty(topics)}" class="not-found-message">
                                <h2>Categories Are Not Available</h2>
                            </div>
                            <hr class="black-hr">
                            <ul style="list-style:none;">
                                <li th:each="topic, iterStat : ${topics}"
                                    style="color: #5c5b5b; text-decoration: double; font-weight:bolder;">
                                    <a th:text="${topic}" th:href="@{'/filter/category/' + ${topic}}"
                                        th:class="'tag color--' + ${iterStat.index}"></a>
                                    <hr>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <!-- // topics -->
            </div>
        </div>
    </div>


    <div class="container" style="margin-left:5%;">
        <div class="page-content">
            <h1 class="recent-posts-title text-center">Recent Posts</h1>
            <div th:replace="~{post :: div}"></div>
        </div>
        <button id="load-more" style="width:62%; margin-left:19%;" onclick="loadMorePosts()">Load More</button>
    </div>

    <div th:replace="~{footer :: div}"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/scripts.js"></script>

    <script>
        let currentPage = 1;
        const pageSize = 5; // Number of posts to load per request

        function loadMorePosts() {
            currentPage++;
            fetch(`/load-more-posts?page=${currentPage}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Network response was not ok: ${response.statusText}`);
                    }
                    return response.json(); // Parse JSON
                })
                .then(data => {
                    const postContainer = document.getElementById('post-container');

                    data.posts.forEach(post => {
                        const postDiv = document.createElement('div');
                        postDiv.classList.add('post', 'mb-4');
                        postDiv.style.maxWidth = '800px';

                        postDiv.innerHTML = `
                        <div class="post-card p-4">
                            <div class="post-content">
                                <div class="container">
                                    <div class="author-box">
                                        <div class="author-profile">
                                            <img src="${post.image ? 'uploads/bloggers/' + post.image : 'images/logo.jpg'}" alt="Author Profile Picture" class="author-image">
                                        </div>
                                        <div class="author-details">
                                            <h3 class="author-name">${post.name}</h3>
                                            <span>@${post.username}</span>
                                            <p class="author-bio">${post.bio}</p>
                                        </div>
                                    </div>
                                    <div class="post-header d-flex align-items-center">
                                        <h2 class="post-title mb-0">${post.title}</h2>
                                        <div class="post-category">
                                            <span class="badge bg-secondary">${post.category}</span>
                                        </div>
                                    </div>
                                    <div class="post-image ${post.description.length > 1000 ? 'post-image-large' : 'post-image-flex'}">
	                                    <img src="${post.media && post.media !== '' ? 'uploads/posts/' + post.media : ''}" alt="Post Image"
	                                         style="${post.description.length > 1000 ? 'width: inherit; height: inherit;' : 'width: 300px; height: 300px;'}  ${post.media == null || post.media === '' ? ' display: none;' : ''}">
	                                    <div class="post-content" style="overflow-wrap: anywhere;">
	                                        ${post.description.length <= 1000 ? `
	                                            <p class="post-description" style="text-align: left;">
	                                                ${post.description}
	                                            </p>
	                                        ` : `
	                                            <p class="post-description" style="text-align: left;">
	                                                <span>${post.description.substring(0, 1000)}</span>
	                                                <span class="more-text" style="display: none;">
	                                                    ${post.description.length > 2500 ? post.description.substring(1000, 2500) : post.description.substring(1000)}
	                                                </span>
	                                                <button class="toggle-button" style="width:auto;" onclick="toggleReadMore(this)">Read more...</button>
	                                            </p>
	                                        `}
	                                    </div>
	                                </div>
                                    
                                    <div class="post-actions d-flex border-top pt-3" style="gap: 5px; justify-content: center;">
                                        <button class="oper btn btn-dark d-flex align-items-center" style="gap: 5px;">
                                            <i class="bi bi-hand-thumbs-up"></i> <span>${post.likes}</span>
                                        </button>
                                        <button class="oper btn btn-dark d-flex align-items-center" style="gap: 5px;">
                                            <i class="bi bi-hand-thumbs-down"></i> <span>${post.dislikes}</span>
                                        </button>
                                        <button class="btn btn-dark d-flex align-items-center" data-bs-toggle="modal" data-bs-target="#commentModal" style="gap: 5px;">
                                            <i class="bi bi-chat"></i><span>${post.comments}</span>
                                        </button>
                                        <button class="btn btn-dark d-flex align-items-center" style="gap: 5px; justify-content: center;">
                                            <i class="bi bi-reply"></i>
                                        </button>
                                        <button class="btn btn-dark d-flex align-items-center" style="gap: 5px; justify-content: center;">
                                            <i class="bi bi-share"></i>
                                        </button>
                                    </div>
                                    <div class="mycard d-flex" style="flex-direction: row; flex-wrap: wrap; min-height: 50px;">
                                        ${post.keywords.length ? `
                                            <h2 style="display: inline; color: #5c5b5b;">Keywords:</h2>
                                            ${post.keywords.map((keyword, index) => `
                                                <button class="tag color-${index}-clicked" data-keyword="${keyword}" onclick="selectKeyword(this, event)">
                                                    ${keyword}
                                                </button>`).join('')}
                                        ` : `<h2 style="display: inline; color: #5c5b5b;">Keywords Not Selected</h2>`}
                                    </div>
                                    <div class="post-metadata">
                                        <div class="author-info">
                                            <i class="icon-user"></i> <span>@${post.username}</span>
                                        </div>
                                        <div class="post-date">
                                            <i class="icon-calendar"></i> <span>${post.updatedat}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                        postContainer.appendChild(postDiv);
                    });

                    if (!data.hasMore) {
                        alert('No more posts!');
                        document.getElementById('load-more').style.display = 'none';
                    }
                })
                .catch(error => {
                    alert('Please log in to load more posts.');
                    console.error('Error loading more posts:', error);
//                    setTimeout(() => window.location.href = '/login', 3000);
                });
        }


    </script>

</body>

</html>
