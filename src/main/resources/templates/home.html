<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" style="background: #343a40;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, shrink-to-fit=no">
    <title>Home - Tech2xplore</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>


<body style="background:#343a40">
	
	<style th:each="color, iterStat : ${colors}">
        .color-[[${iterStat.index}]]:hover {
            color : [[${color}]];
            font-weight: 900;
        }
        .color-[[${iterStat.index}]] {
        	font-weight: 600;
        	transition : 0.3s;
        }
    </style>

    <div th:replace="~{header :: nav}"></div>
    <div class="container mt-5">
        <h1>Welcome to Tech2xplore</h1>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-md-8">
                <div class="slider-container">
                    <div id="imageCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="7000">
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <img th:src="@{images/logo.jpg}" class="d-block w-100" alt="Image 1">
                            </div>
                            <div class="carousel-item">
                                <img th:src="@{images/logo.jpg}" class="d-block w-100" alt="Image 2">
                            </div>
                            <div class="carousel-item">
                                <img th:src="@{images/logo.jpg}" class="d-block w-100" alt="Image 3">
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#imageCarousel"
                            data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#imageCarousel"
                            data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>
                </div>
            </div>


            <div class="col-md-4">
                <div class="content">
                    <div class="slider">
                        <div class="search-div">
                            <form th:action="@{/search}" method="post">
                                <input type="text" name="keyword" class="text-input" placeholder="Search...">
                            </form>
                        </div>
                        <!-- // Search -->
                        <!-- topics -->
                        <div class="section topics">
                            <h2>Topics</h2>
                            <div th:if="${#lists.isEmpty(topics)}" class="not-found-message">
                                <h2>Categories Are Not Available</h2>
                            </div>
                            <hr class="black-hr">
                            <ul style="list-style:none;">
                                <li th:each="topic, iterStat : ${topics}"
                                    style="color: #5c5b5b; text-decoration: double; font-weight:bolder;">
                                    <a th:text="${topic}" th:href="@{'/filter/' + ${topic}}" th:class="'tag color-' + ${iterStat.index}" ></a>
                                    <hr>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <!-- // topics -->
            </div>
        </div>
    </div>


	<div class="container" style="margin-left:5%;">
	    <div class="page-content">
	        <h1 class="recent-posts-title text-center">Recent Posts</h1>
	        <div th:replace="~{post :: div}"></div>
	    </div>
   	    <button id="load-more" style="width:62%; margin-left:19%;" onclick="loadMorePosts()">Load More</button>
    </div>
    
    <div th:replace="~{footer :: div}"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/scripts.js"></script>

    <script>
        let currentPage = 1;
        const pageSize = 5; // Number of posts to load per request

        function loadMorePosts() {
            currentPage++;

            fetch(`/load-more-posts?page=${currentPage}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Network response was not ok: ${response.statusText}`);
                    }
                    return response.json(); // Parse the JSON from the response
                })
                .then(data => {
                    const postContainer = document.getElementById('post-container');

                    // Append the new posts to the container
                    data.posts.forEach(post => {
                        const postDiv = document.createElement('div');
                        postDiv.classList.add('post');
                        postDiv.style.maxWidth = '800px';
                        postDiv.style.height = 'auto';
                        postDiv.style.background = "#1e1f23";

                        postDiv.innerHTML = `
                    <div class="post-info">
                        <div class="container">
                            <div class="author-box">
                                <div class="author-profile">
                                    <img src="images/logo.jpg" alt="Author Profile Picture" class="author-image">
                                </div>
                                <div class="author-details">
                                <h3 class="author-name">${post.name} <span> @${post.username} </span> </h3>
        				        <p class="author-bio">
        				            ${post.bio}
        				        </p>    
                                </div>
                            </div>
                            <div class="post-header d-flex align-items-center">
                                <h2 class="post-title mb-0">${post.title}</h2>
                                <div class="post-category">
                                    <span class="badge bg-secondary">${post.category}</span>
                                </div>
                            </div>
                            
                            <div class="container" style="display: flex; flex-wrap: wrap;">
                            <div class="post-image ${post.description.length > 1000 ? 'post-image-large' : 'post-image-flex'}" 
                            	style="${post.description.length > 1000 ? 'width:100%' : 'width: 100%; '}">
                            <img src="images/logo.jpg" 
                                 alt="Post Image" 
                                 style="${post.description.length > 1000 ? 'width: inherit; height: inherit;' : 'width: 300px; height: 300px;'}" />
                            <div class="post-content" style="overflow-wrap:anywhere;	width:100%">
                                ${post.description.length <= 1000 ? `
                                    <p class="post-description" style="text-align: left;">
                                        ${post.description}
                                    </p>
                                ` : `
                                    <p class="post-description" style="text-align: left;">
                                        <span>${post.description.substring(0, 2500)}</span>
                                        <span class="more-text" style="display: none;">${post.description.substring(2500)}</span>
                                        <button class="toggle-button" onclick="toggleReadMore(this)">Read more...</button>
                                    </p>
                                `}
                            </div>
                        </div>
                                <div class="post-metadata">
                                    <div class="author-info">
                                        <i class="icon-user"></i>
                                        <span class="author-name">${post.username}</span>
                                    </div>
                                    <div class="post-date">
                                        <i class="icon-calendar"></i>
                                        <span class="date-text">${post.publishedat}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                        postContainer.appendChild(postDiv);
                    });

                    // Hide the "Load More" button if there are no more posts
                    if (!data.hasMore) {
                        alert('You have reached the end of the posts!');
                        document.getElementById('load-more').style.display = 'none';
                    }
                })
                .catch(error => {
                    // Handle error case: show alert and optional redirection
                    alert('Please log in to load more posts.');
                    console.error('Error loading more posts:', error);
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 3000);
                });
        }

    </script>

</body>

</html>
