<div class="container" id="blogger-container">
    <div th:if="${#lists.isEmpty(bloggers)}" class="post-content text-center">
        <h2 th:text="${news == null ? 'Our Bloggers' : 'Bloggers Are Inactive Right Now'}"></h2>
    </div>

    <div class="row mb-4" id="blogger-list">
        <div th:each="blogger : ${bloggers}" class="col-12 col-md-6 col-lg-4 mb-4">

            <div th:class="'card blogger-card ' + (${isMe == blogger.authorId ? 'me' : ''} )">

                <div class="card-body text-center">

                    <!-- Profile Image -->
                    <div class="blogger-image-container">
                        <img th:src="${blogger.image != null && blogger.image != '' ? blogger.image : '/images/logo.jpg'}"
                            class="blogger-image" alt="Blogger Image">
                    </div>

                    <!-- Name & Username -->
                    <h5 class="card-title" th:text="${blogger.name}"></h5>
                    <p class="card-text username" th:text="'@' + ${blogger.username}"></p>

                    <div class="d-flex flex-row gap-2">
                        <!-- Follow/Unfollow Button -->
                        <button
                            th:attr="onclick=${blogger.authorId != null} ? 'sendRequest(this,' + ${blogger.authorId} + ', &quot;' + (${blogger.status != null && blogger.status == true ? 'unfollow' : 'follow' }) + '&quot;)' : null"
                            th:class="'btn follow-btn ' + (${blogger.status == null ? 'disabled' : ''} )">
                            <i
                                th:class="'bi ' + (${blogger.status != null && blogger.status == true ? 'bi-person-check-fill' : 'bi-person-plus-fill'})"></i>
                        </button>

                        <button
                            th:attr="onclick=${blogger.authorId != null} ? 'redirectToBlogger(' + ${blogger.authorId} + ')' : null"
                            th:class="'btn follow-btn ' + (${blogger.status == null ? 'disabled' : ''} )">
                            <i class="bi bi-eye"></i>
                        </button>

                        <button
                            th:attr="onclick=${blogger.authorId != null} ? 'copyBlogger(' + ${blogger.authorId} + ')' : null"
                            th:class="'btn follow-btn ' + (${blogger.status == null ? 'disabled' : ''} )">
                            <i class="bi bi-clipboard"></i>
                        </button>
                    </div>

                    <!-- Blogger Stats -->
                    <div class="blogger-stats mt-3">
                        <p><strong th:text="'Followers: ' + ${blogger.followers}"></strong></p>
                        <p><strong th:text="'Followings: ' + ${blogger.followings}"></strong></p>
                        <p><strong th:text="${blogger.posts} + ' Posts'"></strong></p>
                        <p><strong th:text="${blogger.likes} + ' Likes'"></strong></p>
                        <p><strong th:text="${blogger.comments} + ' Comments'"></strong></p>
                        <p class="joined-date" th:text="'Joined: ' + ${blogger.createdat}"></p>
                    </div>

                    <!-- Bio -->
                    <p class="card-text bio"
                        th:text="${blogger.bio != null ? blogger.bio : 'No bio available. This user prefers to keep an air of mystery.'}">
                    </p>

                </div>

            </div>

        </div>
    </div>
</div>
