<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" style="background: #343a40;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, shrink-to-fit=no">
    <title>Home - Tech2xplore</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>
<style>
    .slider-container {
        width: 100%;
        max-width: 600px;
        margin: 20px auto;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .carousel-item img {
        width: 100%;
        height: auto;
        border-radius: 10px;
    }

    .topics {
        background-color: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
</style>

<body style="background:#343a40">


    <div th:replace="~{header :: nav}"></div>

    <div class="container">
        <div class="row">
            <div class="col-md-8">
                <div class="slider-container">
                    <div id="imageCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="7000">
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <img th:src="@{../images/logo.jpg}" class="d-block w-100" alt="Image Not Available">
                            </div>
                        </div>
                    </div>
                </div>
            </div>


            <div class="col-md-4">
                <!-- content -->
                <div class="content clearfix">
                    <div class="page-content">
                        <div class="post-container" id="post-container">
                            <div class="post-info" th:each="p : ${post}">
                                <h2 style="font-size:48px;" class="post-bio" th:text="${p.title}"></h2>
                                <h3 style="font-size:24px;" class="post-bio" th:text="${p.category}"></h3>
                                <h5 style="font-size:20px; color:whitesmoke;" class="post-bio"
                                    th:text="${p.description}"></h5>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{footer :: div}"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/scripts.js"></script>
</body>

</html>
