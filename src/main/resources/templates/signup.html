<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Sign Up </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>

<body >

    <div th:replace="~{header :: nav}"></div>

	<div class="container mt-5 d-flex justify-content-center">
	    <div class="col-md-6">
	        <div class="mycard">

				<div class="text-center border-bottom">
					<h2 class="card-title m-2">Sign Up</h2>
	            </div>

	            <!-- Success Message -->
	            <div th:if="${param.success}" class="mycard card-success text-center mt-3 mb-2">
	                <span th:text="'Registration successful! You can now log in.'"></span>
	            </div>

	            <div class="card-body p-3" id="signup">

	                <!-- Server Error Message -->
	                <div th:if="${error}" class="mycard card-error text-center mb-3">
	                    <span th:text="${error}"></span>
	                </div>

	                <!-- Duplicate Error Message -->
	                <div th:if="${param.error}" class="mycard card-error text-center mb-3">
	                    Username or email already exists!
	                </div>

	                <!-- Form -->
	                <form th:action="@{/register}" method="post" enctype="multipart/form-data">

	                    <div class="mb-3">
	                        <label for="name" class="username">Name</label>
	                        <input type="text" class="form-control" id="name" name="name" required>
	                    </div>

	                    <div class="mb-3">
	                        <label for="username" class="username">Username</label>
	                        <input type="text" class="form-control" id="username" name="username" required>
	                    </div>

	                    <div class="mb-3">
	                        <label for="email" class="username">Email</label>
	                        <input type="email" class="form-control" id="email" name="email" required>
	                    </div>

	                    <div class="mb-3 position-relative">
	                        <label for="password" class="username">Password</label>
	                        <input type="password" class="form-control" id="password" name="password" required>
	                        <span class="position-absolute end-0 top-75 translate-middle-y me-3" onclick="togglePasswordVisibility()" style="cursor: pointer;">
	                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
	                        </span>
	                    </div>

	                    <div class="mb-3">
	                        <label for="confirmPassword" class="username">Confirm Password</label>
	                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
	                    </div>

	                    <div class="mb-3">
	                        <label for="bio" class="username">Bio</label>
	                        <textarea id="bio" name="bio" class="form-control" rows="3" placeholder="Tell us about yourself"></textarea>
	                    </div>

	                    <div class="mb-3">
	                        <label for="image" class="username">Profile Picture</label>
	                        <input type="file" class="form-control" id="image" name="image" accept="image/*">
	                    </div>

	                    <button type="submit" class="tag w-100 mt-3">Sign Up</button>
	                </form>

	                <div class="mt-4 text-center">
	                    <a href="/login" class="link">Already have an account? Login</a>
	                </div>
	            </div>

	            <!-- Loader -->
	            <div class="justify-content-center mt-5 mb-5" style="display :none;" id="loader">
	                <div class="spinner">
	                    <span>Loading...</span>
	                </div>
	            </div>

	        </div>
	    </div>
	</div>

	
    <div th:replace="~{footer :: div}"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/scripts.js"></script>
    <script>

        let queryParameters = window.location.search.substring(1);

        const queries = queryParameters.split("&")

        for (let query of queries) {
            const [key, value] = query.split("=");
            if (key === "success" && value === "true") {
                const loader = document.getElementById("loader");
                const signup = document.getElementById("signup");
                signup.style.display = "none";
                loader.style.display = "show";
                loader.classList.add("d-flex");
                setTimeout(
                    () => {
                        window.location.href = "/secret";
                    }, 3000
                );
                break;
            }
        }


        /* const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
    
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.classList.toggle('bi-eye');
            eyeIcon.classList.toggle('bi-eye-slash');
        });
    
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const confirmEyeIcon = document.getElementById('confirmEyeIcon');
    
        toggleConfirmPassword.addEventListener('click', function () {
            const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPasswordInput.setAttribute('type', type);
            confirmEyeIcon.classList.toggle('bi-eye');
            confirmEyeIcon.classList.toggle('bi-eye-slash');
        }); */

        function togglePasswordVisibility() {
            const passwordField = document.getElementById('password');
            const togglePasswordIcon = document.getElementById('togglePasswordIcon');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                togglePasswordIcon.classList.remove('bi-eye');
                togglePasswordIcon.classList.add('bi-eye-slash');
            } else {
                passwordField.type = 'password';
                togglePasswordIcon.classList.remove('bi-eye-slash');
                togglePasswordIcon.classList.add('bi-eye');
            }
        }
    </script>
</body>

</html>
