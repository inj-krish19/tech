<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Sign Up </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .input-group-text {
            cursor: pointer;
            background-color: #007bff;
            /* Bootstrap primary color */
            border-color: #007bff;
            /* Same color for the border */
            color: white;
            /* White text for visibility */
        }
    </style>
</head>

<body class="bg-dark text-light">

    <div th:replace="~{header :: nav}"></div>

    <div class="container mt-5 d-flex justify-content-center">
        <div class="col-md-6">
            <div class="card bg-secondary border-light">
                <div class="card-header text-center">
                    <h2 class="mb-0">Sign Up</h2>
                </div>
                <div th:if="${param.success}" class="alert alert-success text-center" role="alert">
                    <span th:text="'Registration successful! You can now log in.'"></span>
                </div>
                <div class="card-body" id="signup">

                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <span th:text="${error}"></span>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger">Username or email already exists!</div>

                    <form th:action="@{/register}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3 position-relative">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                            <span class="position-absolute end-0 top-75 translate-middle-y me-3"
                                onclick="togglePasswordVisibility()" style="cursor: pointer;">
                                <i class="bi bi-eye" id="togglePasswordIcon"></i>
                            </span>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="bio" class="form-label">Bio</label>
                            <textarea id="bio" name="bio" class="form-control" rows="3"
                                placeholder="Tell us about yourself"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="image" class="form-label">Profile Picture </label>
                            <input type="file" class="form-control" id="image" name="image" accept="image/*">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="/login" class="text-light">Already have an account? Login</a>
                    </div>
                </div>
                <div class="justify-content-center mt-5 mb-5 " style="display :none; " id="loader">
                    <div class="spinner-border text-success" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{footer :: div}"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/scripts.js"></script>
    <script>

        let queryParameters = window.location.search.substring(1);

        const queries = queryParameters.split("&")

        for (let query of queries) {
            const [key, value] = query.split("=");
            if (key === "success" && value === "true") {
                const loader = document.getElementById("loader");
                const signup = document.getElementById("signup");
                signup.style.display = "none";
                loader.style.display = "show";
                loader.classList.add("d-flex");
                setTimeout(
                    () => {
                        window.location.href = "/secret";
                    }, 3000
                );
                break;
            }
        }

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.classList.toggle('bi-eye');
            eyeIcon.classList.toggle('bi-eye-slash');
        });
    
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const confirmEyeIcon = document.getElementById('confirmEyeIcon');
    
        toggleConfirmPassword.addEventListener('click', function () {
            const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPasswordInput.setAttribute('type', type);
            confirmEyeIcon.classList.toggle('bi-eye');
            confirmEyeIcon.classList.toggle('bi-eye-slash');
        }); */

        function togglePasswordVisibility() {
            const passwordField = document.getElementById('password');
            const togglePasswordIcon = document.getElementById('togglePasswordIcon');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                togglePasswordIcon.classList.remove('bi-eye');
                togglePasswordIcon.classList.add('bi-eye-slash');
            } else {
                passwordField.type = 'password';
                togglePasswordIcon.classList.remove('bi-eye-slash');
                togglePasswordIcon.classList.add('bi-eye');
            }
        }
    </script>
</body>

</html>
