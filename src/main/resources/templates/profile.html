<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" style="background: #343a40;">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>Profile </title>
	<link rel="stylesheet" th:href="@{/css/signup.css}"> <!-- Include your signup.css for theme -->

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="/css/style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">


</head>

<style>
	.special {
		color: #fff;
		width: 100%;
	}
</style>
   	
<style th:each="color, iterStat : ${colors}">
	.color-[[${iterStat.index}]] {
	    background-color: white;
	    border : 1px solid [[${color}]];
	    color : [[${color}]];
	}
	.color-[[${iterStat.index}]]:hover {
	    background-color : [[${color}]];
	    color: white;
	    border: 1px solid [[${color}]];
	}
	
	.color-[[${iterStat.index}]]:click {
	    background-color : [[${color}]];
	    color: white;
	    border: 1px solid [[${color}]];
	}
	
	.color-[[${iterStat.index}]]-clicked {
	    background-color : [[${color}]];
	    color: white;
	    border: 1px solid [[${color}]];
	}
</style>

<body class="bg-dark text-light">
	<div th:replace="~{header :: nav}"></div>
	<div class="container mt-5">

		<div class="container p-5" id="blogger-container">
		    <div class="row mb-4" th:each="blogger : ${bloggers}">
		        <div class="col-md-12">
		            <div class="card mb-3">
		                <div class="row g-0 align-items-center p-2">
		                    <!-- Blogger Image -->
		                    <div class="col-md-4 text-center">
		                        <img th:src="${blogger.image != null && blogger.image != '' ? blogger.image : '/images/logo.jpg'}"
		                            class="img-fluid rounded-circle p-1" style="height: 250px; width: 250px;" alt="Blogger Image">
		                    </div>
		
		                    <!-- Blogger Info -->
		                    <div class="col-md-4">
		                        <div class="card-body">
		                            <h3 class="card-title text-dark" th:text="${blogger.name}"></h3>
		                            <h4 class="text-secondary">
		                                <strong th:text="'@' + ${blogger.username}"></strong>
		                            </h4>
		                            <h5>
			                            <strong class="text-success" th:text="'Joined at ' + ${blogger.createdat}"></strong>
			                        </h5>
		                            <h5 class="text-muted">
		                                <small th:text="${blogger.bio}"></small>
		                            </h5>
		                            <div class="d-flex justify-content-center gap-2">
			                            <button class="btn btn-info">
			                                <i class="bi bi-person-plus-fill"></i>
			                            </button>
			                            <button class="btn btn-info">
			                                <i class="bi bi-linkedin"></i>
			                            </button>
			                        </div>
		                        </div>
		                    </div>
		
		                    <!-- Blogger Stats and Actions -->
		                    <div class="col-md-4">
		                    	<div class="card-body">
		                            <p class="text-secondary mb-1">
		                                <strong th:text="${blogger.posts} + ' Posts'"></strong> till now
		                            </p>
			                        <p class="text-primary mb-1">
		                                <strong th:text="${blogger.likes} + ' Likes'"></strong> received on Posts
		                            </p>
			                        <p class="text-warning">
			                            <strong th:text="${blogger.comments} + ' Comments'"></strong> Received
			                        </p>
		                            <p class="text-info mb-1">
		                                <strong th:text="'Followers: ' + ${blogger.followers}"></strong>
		                            </p>
		                            <p class="text-info mb-1">
		                                <strong th:text="'Followings: ' + ${blogger.followings}"></strong>
		                            </p>
			                    </div>
		                    </div>
		                </div>
		            </div>
		        </div>
		    </div>
		</div>
		

		<div class="container p-2" style=" border: 2px solid #495057; border-radius: 5px;">
			<nav class="nav nav-pills nav-justified ">
				  <a class="nav-link nav-item active special " id="nav-profile-tab" data-bs-toggle="tab" href="#nav-profile" role="tab"
				    aria-controls="nav-profile" aria-selected="true">
				    <i class="bi bi-person-vcard-fill"></i> Profile
				  </a>
				  <a class="nav-link nav-item special " id="nav-follower-tab" data-bs-toggle="tab" href="#nav-follower" role="tab"
				    aria-controls="nav-follower" aria-selected="false">
				    <i class="bi bi-people-fill"></i> Followers
				  </a>
				  <a class="nav-link nav-item special " id="nav-following-tab" data-bs-toggle="tab" href="#nav-following" role="tab"
				    aria-controls="nav-following" aria-selected="false">
				    <i class="bi bi-person-fill-check"></i> Followings
				  </a>
				  <a class="nav-link nav-item special " id="nav-posts-tab" data-bs-toggle="tab" href="#nav-posts" role="tab"
				    aria-controls="nav-posts" aria-selected="false">
				    <i class="bi bi-person-square"></i> Posts
				  </a>
			</nav>
			<hr class="mb-5">

			<div class="tab-content" id="nav-tabContent">
				<div class="container tab-pane fade show active" id="nav-profile" role="tabpanel"
					aria-labelledby="nav-profile-tab">

					<div class="alert text-center" role="alert" id="messageBoxManual">
						<span id="message"></span>
					</div>

					<h2 class="text-center" style="margin-bottom: 15px;">Profile </h2>
					<div class="mb-3">
						<label for="username" class="form-label">Username</label>
						<div class="input-group">
							<input type="text" class="form-control custom-input-box" id="username" name="username"
								th:value="${user.username}" disabled>
							<button class="btn btn-outline-primary custom-icon-box" type="button" data-bs-toggle="modal"
								data-bs-target="#editUsernameModal">
								<i class="bi bi-pencil"></i>
							</button>
						</div>
					</div>
					<div class="mb-3">
						<label for="email" class="form-label">Email</label>
						<div class="input-group">
							<input type="email" class="form-control custom-input-box" id="email" name="email"
								th:value="${user.email}" disabled>
							<button class="btn btn-outline-primary custom-icon-box" type="button" data-bs-toggle="modal"
								data-bs-target="#editEmailModal">
								<i class="bi bi-pencil"></i>
							</button>
						</div>
					</div>
					<div class="mb-3">
						<label for="password" class="form-label">Password</label>
						<div class="input-group">
							<input type="password" class="form-control custom-input-box" id="password" name="password"
								th:value="'********'" disabled>
							<button class="btn btn-outline-primary custom-icon-box" type="button" data-bs-toggle="modal"
								data-bs-target="#editPasswordModal">
								<i class="bi bi-pencil"></i>
							</button>
						</div>
					</div>
					<div class="mb-3">
						<label for="bio" class="form-label">Bio</label>
						<div class="input-group">
							<textarea class="form-control custom-input-box" id="bio" name="bio" rows="3"
								th:text="${user.bio}" disabled></textarea>
							<button class="btn btn-outline-primary custom-icon-box" type="button" data-bs-toggle="modal"
								data-bs-target="#editBioModal">
								<i class="bi bi-pencil"></i>
							</button>
						</div>
					</div>
					<div class="mb-3">
						<label for="profilePicture" class="form-label">Profile Picture</label>
						<div class="input-group">
							<img th:src="${user.image != null && user.image != '' ? '/uploads/bloggers/' + user.image : '/images/logo.jpg'}"
								style=" height: 215px; width:215px; " class="img-fluid rounded-circle p-1"
								alt="Blogger Image">
							<input type="file" class="form-control custom-input-box" id="profilePicture"
								name="profilePicture" accept="image/*" style="width: auto; ">
							<button class="btn btn-outline-primary custom-icon-box" type="button"
								onclick="updateProfilePicture('profilePicture')">
								<i class="bi bi-upload"></i>
							</button>
						</div>
					</div>
					
									
					<!-- Modals for Editing -->
					<!-- Edit Username Modal -->
					<div class="modal fade" id="editUsernameModal" tabindex="-1" aria-labelledby="editUsernameModalLabel"
						aria-hidden="true">
						<div class="modal-dialog">
							<div class="modal-content bg-secondary text-light">
								<div class="modal-header">
									<h5 class="modal-title" id="editUsernameModalLabel">Edit Username</h5>
									<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
								</div>
								<div class="modal-body">
									<input type="text" class="form-control" id="editUsername" name="editUsername"
										th:value="${user.username}">
								</div>
								<div class="modal-footer">
									<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
									<button type="button" class="btn btn-primary" onclick="updateProfile('username')">Save
										changes</button>
								</div>
							</div>
						</div>
					</div>
				
					<!-- Edit Email Modal -->
					<div class="modal fade" id="editEmailModal" tabindex="-1" aria-labelledby="editEmailModalLabel" aria-hidden="true">
						<div class="modal-dialog">
							<div class="modal-content bg-secondary text-light">
								<div class="modal-header">
									<h5 class="modal-title" id="editEmailModalLabel">Edit Email</h5>
									<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
								</div>
								<div class="modal-body">
									<input type="email" class="form-control" id="editEmail" name="editEmail" th:value="${user.email}">
								</div>
								<div class="modal-footer">
									<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
									<button type="button" class="btn btn-primary" onclick="updateProfile('email')">Save changes</button>
								</div>
							</div>
						</div>
					</div>
				
					<div class="modal fade" id="editPasswordModal" tabindex="-1" aria-labelledby="editPasswordModalLabel"
						aria-hidden="true">
						<div class="modal-dialog">
							<div class="modal-content bg-secondary text-light">
								<div class="modal-header">
									<h5 class="modal-title" id="editPasswordModalLabel">Change Password</h5>
									<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
								</div>
								<div class="modal-body">
									<input type="password" class="form-control" id="editPassword" name="editPassword"
										th:value="'********'">
								</div>
								<div class="modal-footer">
									<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
									<button type="button" class="btn btn-primary" onclick="updateProfile('password')">Save
										changes</button>
								</div>
							</div>
						</div>
					</div>
				
					<!-- Edit Bio Modal -->
					<div class="modal fade" id="editBioModal" tabindex="-1" aria-labelledby="editBioModalLabel" aria-hidden="true">
						<div class="modal-dialog">
							<div class="modal-content bg-secondary text-light">
								<div class="modal-header">
									<h5 class="modal-title" id="editBioModalLabel">Edit Bio</h5>
									<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
								</div>
								<div class="modal-body">
									<textarea class="form-control" id="editBio" name="editBio" rows="3"
										th:text="${user.bio}"></textarea>
								</div>
								<div class="modal-footer">
									<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
									<button type="button" class="btn btn-primary" onclick="updateProfile('bio')">Save changes</button>
								</div>
							</div>
						</div>
					</div>
					
					
				</div>

				<div class="container tab-pane fade" id="nav-follower" role="tabpanel"
					aria-labelledby="nav-follower-tab">
					<h2 class="text-center" style="margin-bottom: 15px;">Followers </h2>
					<div th:if="${#lists.isEmpty(followersList)}" class="alert alert-dark text-center">
				    	<h2 th:text="${news != null ? news : 'Yet to start journey to find Followers'}"></h2>
					</div>
					<div th:each="blogger : ${followersList}" class="container m-5 mx-auto" style="max-width:800px;">
						<div class="author-box mb-5">
							<div class="author-profile">
								<img th:src="${blogger.image != null && blogger.image != '' ? blogger.image : '/images/logo.jpg'}"
								 alt="Author Profile Picture" class="author-image">
							</div>
							<div class="author-details">
								<h3 class="author-name" th:text="${blogger.name}"></h3>
								<span th:text="'@'+${blogger.username}"></span>
								<p class="author-bio" th:text="${blogger.bio}"></p>
							</div>
						</div>
					</div>
				</div>

				<div class="container tab-pane fade" id="nav-following" role="tabpanel"
					aria-labelledby="nav-following-tab">
					<h2 class="text-center" style="margin-bottom: 15px;">Followings </h2>
					<div th:if="${#lists.isEmpty(followingsList)}" class="alert alert-dark text-center">
				    	<h2 th:text="${news != null ? news : 'Yet to explore experts in Journey '}"></h2>
					</div>
					<div th:each="blogger : ${followingsList}" class="container m-5 mx-auto" style="max-width:800px;">
						<div class="author-box mb-5">
							<div class="author-profile">
								<img th:src="${blogger.image != null && blogger.image != '' ? blogger.image : '/images/logo.jpg'}"
								 alt="Author Profile Picture" class="author-image">
							</div>
							<div class="author-details">
								<h3 class="author-name" th:text="${blogger.name}"></h3>
								<span th:text="'@'+${blogger.username}"></span>
								<p class="author-bio" th:text="${blogger.bio}"></p>
							</div>
						</div>
					</div>
				</div>

				<div class="container tab-pane fade" id="nav-posts" role="tabpanel" aria-labelledby="nav-posts-tab">
					<h2 class="text-center" style="margin-bottom: 15px;">My Posts </h2>
					<div th:replace="~{post :: div}"></div>
				</div>
			</div>
		</div>
	</div>

	<div th:replace="~{footer :: div}"></div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/js/scripts.js"></script>
	<script>

		const manual = document.getElementById("messageBoxManual");
		const message = document.getElementById("message");

		async function updateProfilePicture(field) {
			let formData = new FormData();

			console.log("File received");

			if (field === 'profilePicture') {
				const fileInput = document.getElementById('profilePicture');
				const file = fileInput.files[0];

				if (!file) {
					alert('Please select a file to upload.');
					return;
				}
				console.log("File uploaded");

				formData.append('profilePicture', file);
			} else {
				console.error('Unsupported field for updateProfile');
				return;
			}

			try {
				const response = await fetch('/update-picture', {
					method: 'POST',
					body: formData,
				});

				const result = await response.json();

				console.log("Response Got");

				if (response.ok) {

					manual.style.display = "show";
					manual.classList.add("alert-success");
					message.innerHTML = `Profile Picture Updated Successfully`;
					setTimeout(() => {
						location.reload(true);
					}, 3000);

				} else {

					manual.style.display = "show";
					manual.classList.add("alert-danger");
					message.innerHTML = `Failed to update Profile Picture`;

				}
			} catch (error) {
				manual.style.display = "show";
				manual.classList.add("alert-warning");
				message.innerHTML = `Failed to upload File`;
			}
		}


		function updateProfile(field) {
			let value;
			switch (field) {
				case 'username':
					value = document.getElementById('editUsername').value;
					break;
				case 'email':
					value = document.getElementById('editEmail').value;
					break;
				case 'password':
					value = document.getElementById('editPassword').value;
					break;
				case 'bio':
					value = document.getElementById('editBio').value;
					break;
				default:
					return; // Exit if the field is not recognized
			}
			// Make an AJAX call to update the user profile in the database
			const modalId = `edit${field.charAt(0).toUpperCase() + field.slice(1)}Modal`;
			const modalElement = document.getElementById(modalId);
			const modalInstance = bootstrap.Modal.getInstance(modalElement);
			if (modalInstance) modalInstance.hide();

			fetch('/profile', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json',
				},
				body: JSON.stringify({
					field: field,
					value: value
				})
			})
				.then(response => {

					if (!response.ok) {
						// warning

						manual.style.display = "show";
						// manual.classList.add("alert-warning");
						message.innerHTML = `Some Challanges Occured To Update ${field.charAt(0).toUpperCase() + field.slice(1)}`;

					}
					return response.json();
				})
				.then(data => {
					// Update the displayed value
					switch (field) {
						case 'username':
							document.getElementById('username').value = data.username;
							break;
						case 'email':
							document.getElementById('email').value = data.email;
							break;
						case 'password':
							document.getElementById('password').value = data.password;
							break;
						case 'bio':
							document.getElementById('bio').value = data.bio;
							break;
					}

					// success                    
					manual.style.display = "show";
					manual.classList.add("alert-success");
					message.innerHTML = `Successfully Updated ${field.charAt(0).toUpperCase() + field.slice(1)}`;

					if (data.password != null) {
						message.innerHTML = `Successfully Updated ${field.charAt(0).toUpperCase() + field.slice(1)}. New password Can Be Used After Restart of Server`;
					}

				})
				.catch(error => {

					// danger 
					manual.style.display = "show";
					manual.classList.add("alert-danger");
					message.innerHTML = `Failed To Update ${field.charAt(0).toUpperCase() + field.slice(1)}`;

				});
		}
	</script>

</body>

</html>
